name: Build Velocity Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Proxy module
        env:
          WS_SERVER_URL: ${{ secrets.WS_SERVER_URL }}
        run: |
          chmod +x gradlew
          ./gradlew :server-Proxy:shadowJar -x test --configure-on-demand -Dorg.gradle.daemon=false -PwsServerUrl="$WS_SERVER_URL"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuHoBot-Velocity
          path: server/Proxy/build/libs/HuHoBot-*-Proxy.jar